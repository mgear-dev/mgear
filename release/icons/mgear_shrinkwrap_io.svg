  <circle cx="12" cy="12" r="10" stroke-dasharray="2.6 3.2"/>
  <!-- Target shape -->
  <rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/>
  <!-- Inward wrap arrows (colored) -->
  <g stroke="#7cb5a0">
    <polyline points="10,4.2 12,6.2 14,4.2"/>
    <polyline points="10,19.8 12,17.8 14,19.8"/>
    <polyline points="4.2,10 6.2,12 4.2,14"/>
    <polyline points="19.8,10 17.8,12 19.8,14"/>
  </g>
</svg>
